[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "commsim"
version = "0.1.0"
description = "Reproducible digital communication experiments checked against theory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Prajwal Pratap Yadav", email = "prajwalpratapyadav5@gmail.com"}]
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.11.13", "black==25.1.0", "mypy==1.15.0", "build==1.2.2.post1", "pre-commit==4.2.0", "pip-audit==2.9.0", "setuptools==80.9.0", "wheel==0.45.1"]

[project.scripts]
commsim = "commsim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src/commsim"]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true
