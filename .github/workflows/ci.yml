name: CI
on:
  push:
    branches: [main, portfolio-overhaul]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: make setup lint typecheck test docs build run
      - name: Audit runtime dependencies
        run: .venv/bin/python -m pip_audit -r requirements-runtime.lock --strict
      - name: Full-history and working-tree secrets scan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/checksums.txt)
          printf '%s  /tmp/gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --log-opts="--all" --redact
          /tmp/gitleaks dir --redact .

  matlab-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install GNU Octave
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends octave
      - name: Run corrected MATLAB-compatible reference against theory
        run: octave --no-gui --quiet --eval "addpath('matlab'); run_reference(17, 400000, '/tmp/matlab_ber.csv');"

  release_policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: policy
        name: Preserve published versions during maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          source = Path("pyproject.toml")
          if source.suffix == ".json":
              version = json.loads(source.read_text())["version"]
          else:
              version = tomllib.loads(source.read_text())["project"]["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9][0-9A-Za-z.+-]{0,79}", version):
              raise SystemExit("Invalid project release version")
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/v{version}'
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  published = not json.load(response).get("draft", False)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Release policy lookup failed: HTTP {error.code}") from None
              published = False
          publish = str(not published).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={publish}\n")
          print(f"v{version}: " + ("published release preserved" if published else "eligible for normal release gates"))
          PY

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.release_policy.outputs.publish == 'true'
    needs: [python, matlab-reference, release_policy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: make setup build
      - name: Publish the validated default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
