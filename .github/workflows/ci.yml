name: CI
on:
  push:
    branches: [main, portfolio-overhaul]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: make setup lint typecheck test docs build run
      - name: Audit runtime dependencies
        run: .venv/bin/python -m pip_audit -r requirements-runtime.lock --strict
      - name: Full-history and working-tree secrets scan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/checksums.txt)
          printf '%s  /tmp/gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --log-opts="--all" --redact
          /tmp/gitleaks dir --redact .

  matlab-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install GNU Octave
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends octave
      - name: Run corrected MATLAB-compatible reference against theory
        run: octave --no-gui --quiet --eval "addpath('matlab'); run_reference(17, 400000, '/tmp/matlab_ber.csv');"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, matlab-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: make setup build
      - name: Publish the validated default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
