name: Reproducible defect
description: Report a simulator, installation or documentation defect.
title: "bug: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Command, configuration, version/commit, expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: OS, Python/MATLAB/Octave version, seed and relevant output. Remove private data.
    validations:
      required: true
